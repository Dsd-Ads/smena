<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>График смен и выплаты</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f1;--ink:#14201f;--mut:#5d6d6b;--card:#fff;--line:#d3dcda;--shift:#0f6b5c;--shift2:#5b3fa0;--on:#fff;--amber:#f0b429;--amberink:#3b2a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101716;--ink:#e6efed;--mut:#93a5a2;--card:#182220;--line:#2b3a37;--shift:#2fb59d;--shift2:#9d86e8;--on:#06201b}}
:root[data-theme="dark"]{--bg:#101716;--ink:#e6efed;--mut:#93a5a2;--card:#182220;--line:#2b3a37;--shift:#2fb59d;--shift2:#9d86e8;--on:#06201b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top h1{font-size:22px;font-weight:800;margin:0;text-transform:capitalize}
.nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;margin-left:6px;cursor:pointer}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.box small{color:var(--mut);display:block;font-size:12.5px}
.box b{display:block;font-size:24px;font-weight:800;margin-top:2px}
.total{background:var(--amber);color:var(--amberink);border:0;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.total b{font-size:28px;margin:0}
.total small{color:var(--amberink)}
.set{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.set label{font-size:12px;color:var(--mut)}
input{width:100%;font:inherit;font-size:17px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-top:3px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.seg button.on1{background:var(--shift);color:var(--on);border-color:var(--shift)}
.seg button.on2{background:var(--shift2);color:var(--on);border-color:var(--shift2)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:12px;color:var(--mut);text-align:center;padding-bottom:2px}
.d{aspect-ratio:1/1.05;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0}
.d span{font-size:15px;font-weight:600}
.d i{font-style:normal;font-size:10.5px;opacity:.9}
.d.s1{background:var(--shift);color:var(--on);border-color:var(--shift)}
.d.s2{background:var(--shift2);color:var(--on);border-color:var(--shift2)}
.d.sel{outline:3px solid var(--amber);outline-offset:1px}
.d.split{border-right:3px solid var(--amber)}
.d:focus-visible,.nav button:focus-visible,input:focus-visible,.act button:focus-visible,.seg button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.edit{margin-top:12px}
.edit p{margin:0 0 8px;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row label{font-size:12.5px;color:var(--mut)}
.act{display:flex;gap:8px;margin-top:10px}
.act button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.act .del{color:#c0392b}
.note{color:var(--mut);font-size:12.5px;margin-top:6px}
.hint{color:var(--mut);font-size:12.5px;margin-top:12px}
[hidden]{display:none}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 id="title"></h1>
    <div class="nav"><button id="prev" aria-label="Прошлый месяц">‹</button><button id="next" aria-label="Следующий месяц">›</button></div>
  </div>

  <div class="pay">
    <div class="box"><small id="l1">Аванс</small><b id="p1">0 ₽</b><small id="c1"></small></div>
    <div class="box"><small id="l2">Расчёт</small><b id="p2">0 ₽</b><small id="c2"></small></div>
  </div>
  <div class="box total"><div><small id="ct">Смен: 0</small><small id="tx"></small></div><b id="pt">0 ₽</b></div>

  <div class="set">
    <label>Смена, ₽<input id="r1" type="number" inputmode="numeric" min="0"></label>
    <label>Надбавка, ₽<input id="r2" type="number" inputmode="numeric" min="0"></label>
    <label>Аванс за дни до<input id="split" type="number" inputmode="numeric" min="1" max="28"></label>
  </div>

  <div class="seg" role="group" aria-label="Какую смену добавлять">
    <button id="t1">Обычная смена</button><button id="t2">С надбавкой</button>
  </div>

  <div class="grid" id="dow"></div>
  <div class="grid" id="grid" style="margin-top:5px"></div>

  <div class="box edit" id="edit" hidden>
    <p id="etitle"></p>
    <div class="seg"><button id="e1">Обычная</button><button id="e2">С надбавкой</button></div>
    <div class="row">
      <label>Цена смены, ₽<input id="ep" type="number" inputmode="numeric" min="0"></label>
      <label>Такси за день, ₽<input id="ex" type="number" inputmode="numeric" min="0" placeholder="0"></label>
    </div>
    <div class="note" id="en"></div>
    <div class="act"><button class="del" id="del">Убрать смену</button><button id="close">Готово</button></div>
  </div>

  <p class="hint">Цена смены идёт в аванс или в расчёт по дате. Надбавка и вычет 30% за такси всегда идут в расчёт. Данные сохраняются в вашем аккаунте Telegram.</p>
</main>
<script>
const KEY='shifts-v3',TAXI=0.3;
let st={r1:4500,r2:300,split:15,add:1,shifts:{}};
try{
  const r=localStorage.getItem(KEY);
  if(r)st=Object.assign(st,JSON.parse(r));
  else{
    const o=localStorage.getItem('shifts-v2');
    if(o){const old=JSON.parse(o);st.r1=old.r1||4500;st.split=old.split||15;
      for(const k in old.shifts){const v=old.shifts[k];st.shifts[k]={t:v.t,p:v.t===2?st.r1:v.p,b:v.t===2?st.r2:0,x:v.x||0};}}
  }
}catch(e){}
const tg=window.Telegram&&Telegram.WebApp;
const cloud=(tg&&tg.initData&&tg.CloudStorage)?tg.CloudStorage:null;
if(cloud){try{tg.ready();tg.expand();document.documentElement.setAttribute('data-theme',tg.colorScheme==='dark'?'dark':'light');}catch(e){}}
const dirty=new Set();let timer=null;
function flush(){
  timer=null;
  try{cloud.setItem('cfg',JSON.stringify({r1:st.r1,r2:st.r2,split:st.split,add:st.add}),()=>{});}catch(e){}
  dirty.forEach(ck=>{
    const mk=ck.slice(2),o={};
    for(const k in st.shifts)if(k.slice(0,7)===mk)o[k]=st.shifts[k];
    try{cloud.setItem(ck,JSON.stringify(o),()=>{});}catch(e){}
  });
  dirty.clear();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}
  if(cloud){dirty.add('m_'+y+'-'+String(m+1).padStart(2,'0'));clearTimeout(timer);timer=setTimeout(flush,700);}
}
function initCloud(){
  if(!cloud)return;
  cloud.getKeys((e,keys)=>{
    if(e||!keys||!keys.length){
      Object.keys(st.shifts).forEach(k=>dirty.add('m_'+k.slice(0,7)));
      flush();return;
    }
    cloud.getItems(keys,(e2,vals)=>{
      if(e2||!vals)return;
      try{
        if(vals.cfg){const c=JSON.parse(vals.cfg);['r1','r2','split','add'].forEach(f=>{if(c[f]!=null)st[f]=c[f];});}
        const sh={};
        keys.forEach(k=>{if(k.indexOf('m_')===0&&vals[k])Object.assign(sh,JSON.parse(vals[k]));});
        st.shifts=sh;
        try{localStorage.setItem(KEY,JSON.stringify(st));}catch(x){}
        render();
      }catch(x){}
    });
  });
}
const now=new Date();let y=now.getFullYear(),m=now.getMonth(),sel=null;
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const key=d=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const short=p=>p>=1000?(p/1000).toFixed(p%100?2:1).replace(/0$/,'').replace('.',',')+'к':String(p);
['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(t=>{const e=document.createElement('div');e.className='dow';e.textContent=t;$('dow').appendChild(e);});
function render(){
  const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),off=(first.getDay()+6)%7;
  $('title').textContent=first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  const ae=document.activeElement;
  [['r1',st.r1],['r2',st.r2],['split',st.split]].forEach(([id,v])=>{if(ae!==$(id))$(id).value=v;});
  $('t1').className=st.add===1?'on1':'';$('t2').className=st.add===2?'on2':'';
  const g=$('grid');g.innerHTML='';
  for(let i=0;i<off;i++)g.appendChild(document.createElement('div'));
  let s=[0,0],n=[0,0],tax=0,bonus=0;
  for(let d=1;d<=days;d++){
    const k=key(d),v=st.shifts[k],b=document.createElement('button');
    b.className='d'+(v?' s'+v.t:'')+(sel===k?' sel':'')+(d===st.split?' split':'');
    b.innerHTML='<span>'+d+'</span>'+(v?'<i>'+short(v.p)+(v.t===2?'+':'')+'</i>':'');
    b.setAttribute('aria-label',d+(v?', смена '+v.p+' рублей'+(v.t===2?' с надбавкой':''):''));
    b.onclick=()=>tap(d);g.appendChild(b);
    if(v){
      const bi=d>st.split?1:0,w=TAXI*(v.x||0);
      s[bi]+=v.p;n[bi]++;
      if(v.t===2){s[1]+=v.b;bonus+=v.b;}
      s[1]-=w;tax+=w;
    }
  }
  $('l1').textContent='Аванс (1–'+st.split+')';
  $('l2').textContent='Расчёт ('+(st.split+1)+'–'+days+')';
  $('p1').textContent=fmt(s[0]);$('p2').textContent=fmt(s[1]);
  $('c1').textContent='Смен: '+n[0];
  $('c2').textContent='Смен: '+n[1]+(bonus?', надбавки +'+fmt(bonus):'')+(tax?', такси −'+fmt(tax):'');
  $('ct').textContent='Всего за месяц, смен: '+(n[0]+n[1]);
  $('tx').textContent='';
  $('pt').textContent=fmt(s[0]+s[1]);
  const e=$('edit'),v=sel&&st.shifts[sel];
  if(v){
    e.hidden=false;
    $('etitle').textContent=new Date(sel+'T12:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
    $('e1').className=v.t===1?'on1':'';$('e2').className=v.t===2?'on2':'';
    if(ae!==$('ep'))$('ep').value=v.p;
    if(ae!==$('ex'))$('ex').value=v.x||'';
    $('en').textContent=(v.t===2?'Надбавка +'+fmt(v.b)+' в расчёт. ':'')+(v.x?'Такси: удержат 30% = '+fmt(TAXI*v.x)+' из расчёта.':'');
  }else e.hidden=true;
}
function tap(d){
  const k=key(d);
  if(!st.shifts[k]){st.shifts[k]={t:st.add,p:st.r1,b:st.add===2?st.r2:0,x:0};sel=null;}
  else sel=(sel===k)?null:k;
  save();render();
}
$('t1').onclick=()=>{st.add=1;save();render();};
$('t2').onclick=()=>{st.add=2;save();render();};
$('r1').oninput=e=>{st.r1=Math.max(0,+e.target.value||0);save();};
$('r2').oninput=e=>{st.r2=Math.max(0,+e.target.value||0);save();};
$('split').oninput=e=>{st.split=Math.min(28,Math.max(1,+e.target.value||15));save();render();};
function setType(t){const v=st.shifts[sel];if(!v)return;v.t=t;v.b=t===2?st.r2:0;save();render();}
$('e1').onclick=()=>setType(1);$('e2').onclick=()=>setType(2);
$('ep').oninput=e=>{if(sel){st.shifts[sel].p=Math.max(0,+e.target.value||0);save();render();}};
$('ex').oninput=e=>{if(sel){st.shifts[sel].x=Math.max(0,+e.target.value||0);save();render();}};
$('del').onclick=()=>{if(sel){delete st.shifts[sel];sel=null;save();render();}};
$('close').onclick=()=>{sel=null;render();};
$('prev').onclick=()=>{m--;if(m<0){m=11;y--;}sel=null;render();};
$('next').onclick=()=>{m++;if(m>11){m=0;y++;}sel=null;render();};
render();
initCloud();
</script>
</body>
</html>
